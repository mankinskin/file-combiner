name: ci

on:
  push:
    branches: [main, production]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load agent-builder deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENT_BUILDER_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (pull infrastructure-base)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.INFRA_GHCR_PAT }}
      - name: cargo fmt --check && cargo clippy
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lint
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha,scope=lint
          cache-to: type=gha,mode=max,scope=lint

  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load agent-builder deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENT_BUILDER_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (pull infrastructure-base)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.INFRA_GHCR_PAT }}
      - name: cargo test -p backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

  frontend-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load agent-builder deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENT_BUILDER_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (pull infrastructure-base)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.INFRA_GHCR_PAT }}
      - name: Build frontend and run browser smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend-smoke
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha,scope=frontend-smoke
          cache-to: type=gha,mode=max,scope=frontend-smoke

  container-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load agent-builder deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENT_BUILDER_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (pull infrastructure-base)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.INFRA_GHCR_PAT }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: file-combiner:local
          load: true
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha,scope=container-api
          cache-to: type=gha,mode=max,scope=container-api
      - name: Container smoke test
        run: bash scripts/smoke-container.sh file-combiner:local test-group-token test-probe-token

  deploy-render:
    needs: [rust-quality, backend-contract, frontend-browser, container-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: bash scripts/deploy-render.sh "$RENDER_API_KEY" "$RENDER_SERVICE_ID"
      - name: Post-deploy smoke test
        env:
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
          COMBINE_PROBE_TOKEN: ${{ secrets.COMBINE_PROBE_TOKEN }}
        run: bash scripts/smoke-deploy.sh "$RENDER_EXTERNAL_URL" "$COMBINE_PROBE_TOKEN"
